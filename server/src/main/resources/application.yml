spring:
  application:
    name: kec-coding-forum
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kec_coding_forum}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dharsini@3031}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-auth-secret-change-me-please-32-bytes-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  notifications:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    websocket-enabled: ${NOTIFICATION_WEBSOCKET_ENABLED:true}
    from-name: ${NOTIFICATION_FROM_NAME:KEC Coding Forum}
