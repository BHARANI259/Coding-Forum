spring:
  config:
    import: optional:file:.env[.properties],optional:file:server/.env[.properties]
  application:
    name: kec-coding-forum
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kec_coding_forum}}
    username: ${DB_USER:kec_forum_app}
    password: ${DB_PASSWORD:kec_forum_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}
          ssl:
            trust: ${MAIL_SSL_TRUST:smtp.gmail.com}

server:
  port: ${PORT:8080}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: 2KB
    mime-types: application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/xml

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-auth-secret-change-me-please-32-bytes-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  notifications:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    websocket-enabled: ${NOTIFICATION_WEBSOCKET_ENABLED:true}
    from-name: ${NOTIFICATION_FROM_NAME:KEC Coding Forum}
    from-address: ${NOTIFICATION_FROM_ADDRESS:}
  web-push:
    enabled: ${WEB_PUSH_ENABLED:false}
    vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:admin@example.com}
  uploads:
    root-dir: ${UPLOAD_ROOT_DIR:uploads}
    event-posters-dir: ${EVENT_POSTERS_DIR:event-posters}
    event-media-dir: ${EVENT_MEDIA_DIR:event-media}
  security:
    csp-report-only: ${CSP_REPORT_ONLY:default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:12}
      login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      password-max-attempts: ${RATE_LIMIT_PASSWORD_MAX_ATTEMPTS:5}
      password-window-seconds: ${RATE_LIMIT_PASSWORD_WINDOW_SECONDS:300}
